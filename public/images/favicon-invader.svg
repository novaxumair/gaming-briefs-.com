    <rect x="8" y="10" width="24" height="2" />
    <rect x="6" y="12" width="28" height="2" />
    <rect x="14" y="14" width="2" height="4" fill="#0a0f0a" />
    <rect x="24" y="14" width="2" height="4" fill="#0a0f0a" />
    <rect x="6" y="14" width="28" height="2" />
    <rect x="4" y="16" width="32" height="2" />
    <rect x="4" y="18" width="6" height="2" />
